[package]
name = "antares"
version = "0.3.0"
description = "Antares - reproductor de musica"
authors = ["Hanyer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "antares_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: el icono de la bandeja del sistema, para seguir sonando con la
# ventana cerrada.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }

# Solo para la autoactualizacion de yt-dlp. `blocking` porque la comprobacion
# corre en su propio hilo y no necesita el runtime async; `rustls-tls` para no
# depender de OpenSSL ni de la configuracion TLS del sistema.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }

# Decodificar la URL de audio que llega al proxy local, y codificar la busqueda
# de letras. Ya venia en el arbol como dependencia de reqwest.
percent-encoding = "2"

# El aviso de Windows (y de Android) al cambiar de cancion.
tauri-plugin-notification = "2"

# Solo escritorio: no existen (ni compilan) en Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Atajos de teclado que funcionan con la app minimizada o en segundo plano.
tauri-plugin-global-shortcut = "2"
# "Abrir Antares al iniciar Windows" (una entrada en HKCU\...\Run).
tauri-plugin-autostart = "2"
# Actualizaciones de la app: busca una version nueva publicada, comprueba su
# firma y la instala (ver `app_update`).
tauri-plugin-updater = "2"

# Solo Windows: los botones de la miniatura de la barra de tareas (me gusta,
# anterior, play, siguiente), ver `thumbbar`. La misma version que ya trae
# Tauri, para no compilar otra.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Solo para las pruebas: comprobar que el instalador publicado lleva una firma
# que la app acepta (las mismas versiones que ya usa el actualizador).
[dev-dependencies]
minisign-verify = "0.2"
base64 = "0.22"
