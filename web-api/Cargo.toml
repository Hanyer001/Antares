[package]
name = "antares-web-api"
version = "0.1.0"
edition = "2021"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[features]
default = ["web"]
web = []

[dependencies]
antares-core = { path = "../crates/antares-core" }
axum = "0.8"
sha2 = "0.10"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
