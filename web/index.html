<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141019">
  <meta name="description" content="Busca música y arma tu cola con Antares.">
  <title>Antares Web</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <img src="./icon-192.png" width="42" height="42" alt="">
    <span>Antares</span>
    <small>Vista web</small>
  </header>
  <main>
    <div class="main-view">
    <div class="intro">
      <h1>¿Qué quieres escuchar?</h1>
      <form id="search">
        <label class="sr-only" for="query">Canción, artista o enlace de YouTube</label>
        <input id="query" type="search" name="q" maxlength="500" placeholder="Canción, artista o enlace" autocorrect="off" spellcheck="false" required>
        <button type="submit">Buscar</button>
      </form>
      <p id="search-status" role="status">Busca una canción y agrega más a la cola.</p>
      <label class="music-filter"><input type="checkbox" id="only-music"> Solo música</label>
      <div id="search-catalog" class="catalog-actions"></div>
    </div>
    <section id="catalog" class="catalog" aria-labelledby="catalog-title" hidden>
      <button id="catalog-back" type="button">Cerrar catálogo</button>
      <h2 id="catalog-title"></h2>
      <div class="catalog-actions"></div>
      <ul class="tracks"></ul>
      <div class="catalog-shelves"></div>
    </section>
    <div class="panels">
      <section id="results-panel" aria-labelledby="results-title">
        <h2 id="results-title">Resultados</h2>
        <button id="play-results" type="button" hidden>Reproducir resultados</button>
        <ul id="results" class="tracks"></ul>
      </section>
      <section id="queue-panel" aria-labelledby="queue-title">
        <h2 id="queue-title">En cola <span id="count"></span></h2>
        <p id="empty-queue">Agrega canciones para escucharlas en orden.</p>
        <div class="catalog-actions">
          <button id="clear-queued" type="button" hidden>Vaciar añadidas</button>
          <button id="undo-queue" type="button" hidden>Deshacer</button>
        </div>
        <ul id="queue" class="tracks"></ul>
      </section>
    </div>
    </div>
    <section class="player" aria-label="Reproductor">
      <div class="now">
        <strong id="now-title">Sin reproducción</strong>
        <span id="now-artist"></span>
      </div>
      <audio id="audio" preload="none"></audio>
      <div class="player-timeline">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="0" value="0" step="0.1" aria-label="Posición de reproducción" disabled>
        <span id="duration">—</span>
      </div>
      <div class="transport">
        <button id="previous" type="button" disabled>Anterior</button>
        <button id="play-toggle" type="button" disabled>Reproducir</button>
        <button id="next" type="button" disabled>Siguiente</button>
      </div>
      <div class="transport transport-modes">
        <button id="shuffle" type="button" aria-pressed="false">Aleatorio</button>
        <button id="repeat" type="button">Repetir desactivado</button>
        <button id="retry" type="button" hidden>Reintentar</button>
      </div>
      <p id="play-status" role="status" hidden></p>
      <details class="audio-settings">
        <summary>Ajustes de audio</summary>
        <label><input type="checkbox" id="prefetch-next"> Preparar la siguiente pista</label>
        <label><input type="checkbox" id="save-data"> Ahorrar datos</label>
      </details>
      <pre id="play-diagnostics" hidden></pre>
      <details id="lyrics">
        <summary>Letras</summary>
        <p id="lyrics-status" role="status"></p>
        <div id="lyrics-lines"></div>
      </details>
    </section>
  </main>
  <nav class="mobile-navigation" aria-label="Secciones de Antares">
    <button type="button" data-view="search" aria-current="page">Buscar</button>
    <button type="button" data-view="queue">Cola</button>
    <button type="button" data-view="player">Reproductor</button>
  </nav>
</body>
</html>
